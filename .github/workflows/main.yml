name: Build Mod

on:
  push:
    branches: ["hide-or-hunt-(1.21.1)"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with refresh dependencies
        run: gradle build --refresh-dependencies

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: targetdummy-build
          path: build/libs/*.jar
